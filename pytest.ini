# pytest.ini holds pytest's settings. pytest reads it automatically when
# you run `make test` (or .venv/bin/pytest) from the project root.
# Reference: https://docs.pytest.org/en/stable/reference/customize.html

# Every pytest.ini starts with the [pytest] section header.
[pytest]
# pythonpath: folders added to Python's import path (sys.path) while the
# tests run. "." is the project root, so imports that start from the
# project folder (for example `import src.app`) work in every test file.
pythonpath = .
# testpaths: where pytest looks for tests. It collects files named
# test_*.py in tests/ and runs every function whose name starts with test_.
testpaths = tests
