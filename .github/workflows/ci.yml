# GitHub Actions workflow: Continuous Integration (CI).
# GitHub runs every .yml file in .github/workflows/ automatically when its
# trigger event happens. This one runs the test suite on every push and
# pull request to main, so broken code is caught before it is merged.
# Results appear in the repository's Actions tab and next to each commit
# and pull request (a green tick or a red cross).
# Reference: https://docs.github.com/en/actions/using-workflows/workflowsyntax-for-github-actions
# The name shown in the Actions tab.
name: CI — Tests
# "on" lists the events that start the workflow:
#   push to main          tests the code that has been merged
#   pull request to main  tests the code that is PROPOSED for merging, so
#                         reviewers can see the result before they merge
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# A workflow has one or more jobs. This one has a single job called "test".
jobs:
  test:
    # Each run gets a fresh Ubuntu virtual machine (a "runner") from GitHub.
    # It is created when the job starts and destroyed when it ends, so
    # nothing carries over from one run to the next.
    runs-on: ubuntu-latest
    # Steps run in order. "uses:" runs a ready-made action published on
    # GitHub; "run:" runs shell commands on the runner.
    steps:
      # Clone the repository onto the runner. Without this the runner has
      # no code to test.
      - name: Checkout code
        uses: actions/checkout@v6
      # Install Python 3.11, the same version as our Docker image.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Install the project's packages (including pytest and DVC). The runner
      # is a throwaway machine used for this project only, so plain pip
      # without a virtual environment is fine here.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # The API tests load models/model_v1.pkl and models/model_v2.pkl. Those
      # files are git-ignored and tracked with DVC, so they are not in the
      # checkout and must be downloaded from DagsHub.
      # The DagsHub token is stored as a repository secret (Settings >
      # Secrets and variables > Actions) named DAGSHUB_TOKEN.
      # ${{ secrets.DAGSHUB_TOKEN }} inserts it, and the env: block passes it
      # to the commands as the environment variable $DAGSHUB_TOKEN. This
      # keeps the secret out of the command text, and GitHub masks it as ***
      # in the logs.
      # The two `dvc remote modify --local` commands are the same ones you
      # ran by hand (DagsHub uses the token as both keys). `dvc pull` with
      # the two .dvc files downloads only the models, not the data.
      - name: Pull models with DVC
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify origin --local access_key_id "$DAGSHUB_TOKEN"
          dvc remote modify origin --local secret_access_key "$DAGSHUB_TOKEN"
          dvc pull models/model_v1.pkl.dvc models/model_v2.pkl.dvc
      # Run the test suite (settings from pytest.ini). If any test fails,
      # pytest exits with a non-zero code and the job is marked as failed.
      - name: Run tests
        run: pytest
